# Full-stack local demo for the FieldWatch comms openkit.
#
# Brings up:
#   - postgres    Postgres 16 with PostGIS on host port 5434
#   - localstack  LocalStack (SQS) on host port 4566 (auto-creates the queue)
#   - channels    the routing brain (implementations/channels-go) on 9090
#   - webhook     the inbound receiver (implementations/webhook-go) on 8080,
#                 buffers to LocalStack SQS, then drains to channels via HTTP
#
# Usage:
#
#   docker compose up --build
#
#   # send a synthetic WhatsApp payload
#   curl -X POST 'http://localhost:8080/inbound/whatsapp-ultramsg?token=local-secret' \
#        -H 'Content-Type: application/json' \
#        --data @implementations/webhook-go/internal/listeners/ultramsg/testdata/text.json
#
#   # watch it land in channels' DB
#   docker compose exec postgres \
#     psql -U openkit -d openkit \
#     -c 'SELECT direction, body_text, received_at FROM messages ORDER BY received_at DESC LIMIT 5;'
#
# The `seed` service below inserts the tenant + account + contact the demo needs
# and then exits. Without those rows the webhook cannot resolve the inbound
# message to an account and drops it, so the curl above would return 200 and
# persist nothing.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: openkit
      POSTGRES_PASSWORD: openkit
      POSTGRES_DB: openkit
    ports:
      - "5434:5432"
    healthcheck:
      # -h 127.0.0.1 forces a TCP probe. Without it pg_isready answers over the
      # unix socket, which the entrypoint's temporary init server also serves —
      # so the container reports healthy seconds before Postgres listens on TCP,
      # and channels dies on a cold boot with "connection refused".
      test: ["CMD-SHELL", "pg_isready -U openkit -d openkit -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - openkit_pgdata:/var/lib/postgresql/data
      # Creates openkit_test on first boot, so the destructive integration
      # suite has a database of its own to drop and rebuild. Mounted as a
      # single FILE, not a directory: the postgis image ships its own
      # 10_postgis.sh in here, and a directory mount would hide it — leaving
      # openkit without PostGIS and the first migration dirty. The 20- prefix
      # keeps this ordered after it.
      - ./deploy/postgres-init/20-create-test-db.sh:/docker-entrypoint-initdb.d/20-create-test-db.sh:ro

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-west-2
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  channels:
    build:
      context: ./implementations/channels-go
      dockerfile: deploy/Dockerfile
    # The service exits non-zero if the DB is not reachable at boot (it will not
    # serve traffic it cannot persist). Restarting is the correct response to
    # that, here and in production — ECS and Kubernetes do the same thing.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      ENV: "local"
      PORT: "9090"
      LOG_LEVEL: "info"
      DATABASE_URL: "postgres://openkit:openkit@postgres:5432/openkit?sslmode=disable"
      INTERNAL_API_TOKEN: "local-token"
      CREDENTIALS_ENCRYPTION: "localaes"
      # base64 of 32 zero bytes — dev-only key, do NOT reuse in any real deploy.
      LOCAL_AES_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      AWS_REGION: "us-west-2"

  # One-shot: seeds the tenant + account + contact the demo needs, then exits 0.
  # Without it the webhook cannot resolve the inbound message to an account and
  # silently drops it. Idempotent, so it is safe on every `up`.
  seed:
    image: postgis/postgis:16-3.4
    depends_on:
      postgres:
        condition: service_healthy
      channels:
        condition: service_started
    environment:
      PGPASSWORD: openkit
    volumes:
      - ./deploy/seed:/seed:ro
    entrypoint: ["bash", "/seed/seed-demo.sh"]

  webhook:
    build:
      context: ./implementations/webhook-go
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      channels:
        condition: service_started
      localstack:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENV: "local"
      PORT: "8080"
      # Forward canonical messages to the channels service. Must MATCH
      # channels' INTERNAL_API_TOKEN.
      CHANNELS_URL: "http://channels:9090"
      INTERNAL_API_TOKEN: "local-token"
      # UltraMSG listener: shared secret in ?token=<...>
      WHATSAPP_ULTRAMSG_WEBHOOK_SECRET: "local-secret"
      # Accounts are resolved at runtime against channels' /v1/accounts/lookup;
      # the `seed` service above inserts the account this demo needs.
      # LocalStack SQS. The init script under deploy/localstack-init creates
      # the queue at startup. AWS SDK v2 honors AWS_ENDPOINT_URL for all
      # service clients (including SQS).
      AWS_REGION: "us-west-2"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      SQS_QUEUE_URL: "http://localstack:4566/000000000000/openkit-inbound"

volumes:
  openkit_pgdata:
