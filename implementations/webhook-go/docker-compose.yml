# Local end-to-end dev: comms-webhook + a fake comms-channels that logs POSTs.
# No AWS needed — the webhook falls back to the in-memory queue when
# SQS_QUEUE_URL is unset.
#
#   docker compose up --build
#   curl -X POST 'http://localhost:8080/inbound/whatsapp-ultramsg?token=local-secret' \
#        -H 'Content-Type: application/json' \
#        --data @internal/listeners/ultramsg/testdata/text.json
#   # -> watch the fakechannels logs print the canonical message it received
services:
  fakechannels:
    image: golang:1.25-alpine
    working_dir: /src
    volumes:
      - .:/src
    command: ["go", "run", "./cmd/fakechannels"]
    environment:
      PORT: "9090"
    expose:
      - "9090"
    # `go run` compiles before it listens, which on a cold cache takes tens of
    # seconds. Without a readiness gate the webhook accepts a curl in that
    # window, fails the account lookup, and returns internal_error — which
    # reads as a broken demo rather than a service that is still starting.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  comms-webhook:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      fakechannels:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENV: "local"
      PORT: "8080"
      CHANNELS_URL: "http://fakechannels:9090"
      INTERNAL_API_TOKEN: "local-token"
      WHATSAPP_ULTRAMSG_WEBHOOK_SECRET: "local-secret"
      # No account config here: fakechannels stubs /v1/accounts/lookup and
      # resolves every identifier, which is the point of the stub.
      # SQS_QUEUE_URL intentionally unset -> in-memory queue for local dev
