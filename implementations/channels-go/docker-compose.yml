# Local end-to-end dev: comms-channels + Postgres 16 (PostGIS).
#
#   docker compose up --build
#   curl -s http://localhost:9090/healthz    # {"status":"ok"} once ready
#
# For the full openkit stack (webhook -> channels wired end-to-end), use the
# docker-compose.yml at the repo root instead.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: openkit
      POSTGRES_PASSWORD: openkit
      POSTGRES_DB: openkit
    ports:
      - "5434:5432"
    healthcheck:
      # -h 127.0.0.1 forces a TCP probe; over the unix socket the entrypoint's
      # temporary init server answers first and the container reports healthy
      # before Postgres listens on TCP. See the root docker-compose.yml.
      test: ["CMD-SHELL", "pg_isready -U openkit -d openkit -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - channels_pgdata:/var/lib/postgresql/data
      # Creates openkit_test on first boot — see the script's header for why
      # the integration suite must not share the app database. Mounted as a
      # single file so it does not hide the image's own 10_postgis.sh.
      - ../../deploy/postgres-init/20-create-test-db.sh:/docker-entrypoint-initdb.d/20-create-test-db.sh:ro

  comms-channels:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      ENV: "local"
      PORT: "9090"
      LOG_LEVEL: "info"
      DATABASE_URL: "postgres://openkit:openkit@db:5432/openkit?sslmode=disable"
      INTERNAL_API_TOKEN: "local-token"
      CREDENTIALS_ENCRYPTION: "localaes"
      # base64 of 32 zero bytes — dev-only key, do NOT reuse in any real deploy.
      LOCAL_AES_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      AWS_REGION: "us-west-2"

volumes:
  channels_pgdata:
