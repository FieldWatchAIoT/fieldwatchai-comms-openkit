version: "2"
sql:
  - engine: "postgresql"
    # Only the up migrations describe the live schema; the *.down.sql files
    # contain DROPs and must not be fed to sqlc.
    schema:
      - "migrations/*.up.sql"
    queries:
      - "internal/queries/sqlqueries"
    gen:
      go:
        package: "goqueries"
        out: "internal/queries/goqueries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # UUIDs as google/uuid (the house lib); nullable columns as pointers.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Timestamps as time.Time; nullable columns as pointers.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # PostGIS geography has no native Go mapping; carry it opaquely as a
          # string (EWKB/EWKT). Geometry handling lands when a feature needs it.
          # Week 1 never reads or writes body_location.
          - db_type: "geography"
            go_type: "string"
            nullable: true
