# Digital Public Goods manifest
#
# Metadata describing this project against the Digital Public Goods Alliance
# schema. This file signals intent to submit to the DPG Registry (target: Q1
# 2027) and is a machine-readable companion to docs/dpg-alignment.md.
#
# Reference: https://digitalpublicgoods.net/standard/

name: FieldWatch Comms OpenKit
aliases:
  - Comms OpenKit
description: >-
  Open protocol and reference implementations for disaster-response
  communications infrastructure. Publishes a canonical message schema, a
  rule-based command parser grammar, an AI-teammate protocol, and a
  transport adapter contract so any climate-vulnerable jurisdiction can
  stand up interoperable disaster-comms tooling without licensing a
  commercial product.

website: https://fieldwatch.earth/
license:
  - spdx: Apache-2.0
    licenseURL: https://github.com/FieldWatchAIoT/fieldwatchai-comms-openkit/blob/main/LICENSE
repositoryURL: https://github.com/FieldWatchAIoT/fieldwatchai-comms-openkit
organizations:
  - name: FieldWatch AI
    website: https://fieldwatch.earth/
    org_type: owner
    contact_email: hello@fieldwatchai.io

# DPG Standard categories
categories:
  - emerging-technologies

# Sustainable Development Goals — targets this project explicitly addresses.
SDGs:
  - SDGNumber: 11
    evidenceText: >-
      Target 11.5 — reduce deaths and losses from disasters. The OpenKit
      publishes the coordination protocol behind FieldWatch's disaster-
      response product; the founding narrative is Hurricane Dorian
      (Bahamas, 2019), where coordination failure across consumer
      messaging tools compounded the death toll.
  - SDGNumber: 13
    evidenceText: >-
      Target 13.1 — strengthen resilience and adaptive capacity to
      climate-related hazards. The OpenKit is aimed at climate-vulnerable
      small island developing states that cannot afford enterprise
      disaster-comms tooling.
  - SDGNumber: 17
    evidenceText: >-
      Target 17.6 — enhance cooperation on and access to technology.
      The OpenKit is an open protocol and open reference implementations
      any government, NGO, or research group can adopt.

# DPG Standard indicators — see docs/dpg-alignment.md for the full mapping.
# Values: "yes" | "no" | "N/A". A more detailed status (complete / in
# progress / planned) is tracked in docs/dpg-alignment.md.
standardsAndBestPractices:
  - Apache-2.0 (SPDX)
  - JSON Schema (draft 2020-12) for wire format
  - RFC 3339 for timestamps
  - E.164 for phone numbers
  - RFC 5321 for email mailbox format
  - Constant-time comparison for secret verification
  - Semantic Versioning for spec releases

# Machine-readability + interoperability of the outputs.
type:
  - software
  - standard

# Development status.
stage: development

# Reference implementations shipped in-repo. Each is a working, runnable
# starter that adopters can build against or deploy directly. Additional
# implementations (satellite adapters, voice) are on the roadmap — see the
# root README.
implementations:
  - name: webhook-go
    language: Go
    path: implementations/webhook-go
    description: >-
      Inbound webhook receiver. Verifies platform signatures/secrets,
      normalizes payloads into the canonical message schema, buffers to a
      durable queue (SQS or in-memory), and forwards to a downstream
      channels service. Ships UltraMSG WhatsApp, Twilio SMS+WhatsApp,
      Telegram Bot API, and AWS SES email listeners in one binary.
    runnable: docker compose up --build
    deployment:
      - kind: docker-compose
        path: implementations/webhook-go/docker-compose.yml
      - kind: terraform-aws
        path: implementations/webhook-go/deploy/terraform/aws
        description: >-
          Minimal ECS Fargate + ALB + SQS reference module. Reviewable
          in one sitting; adopters should read the module README before
          applying (default VPC / public subnets are used only so a
          first-time apply works out of the box).
  - name: channels-go
    language: Go
    path: implementations/channels-go
    description: >-
      Routing brain. Owns the Postgres 16 + PostGIS schema. Accepts
      canonical messages from the webhook, resolves senders to contacts,
      runs the rule-based command parser, scores confidence, applies the
      policy gate (execute / echo back / clarify / drop), persists every
      message, dispatches outbound replies through platform integrations
      (UltraMSG WhatsApp, Twilio SMS+WhatsApp, Telegram, AWS SES v2
      email), and fires workflow webhooks to downstream consumer
      products. Per-account platform credentials are encrypted at rest
      via a pluggable Encryptor (AES-256-GCM locally, AWS KMS in prod).
    runnable: docker compose up --build
    deployment:
      - kind: docker-compose
        path: implementations/channels-go/docker-compose.yml
      - kind: docker-compose
        path: docker-compose.yml
        description: >-
          Root docker-compose bringing up the full stack —
          webhook + channels + Postgres + LocalStack SQS — wired
          end-to-end. This is the single-command demo of the entire
          openkit.
      - kind: terraform-aws
        path: implementations/channels-go/deploy/terraform/aws
        description: >-
          Aurora Postgres (Serverless v2) + ECS Fargate + ALB +
          customer-managed KMS key + Secrets Manager. Reviewable
          in one sitting; adopters must read the module README
          before applying (DB config in particular is set for a
          reference apply, not for a hardened production database).

# Non-collection of PII: the schema is designed to minimize collection to
# only what the source platform delivered. See docs/dpg-alignment.md
# indicator 7.
privacyAndDataProtection: >-
  Data minimization: adapters emit exactly what the source platform
  delivered — no enrichment, no geolocation, no profiling. Media is
  passed through as URLs to platform hosting; the OpenKit does not
  re-host. Reference implementations do not log message bodies at
  INFO or higher log levels. Tenant-defined retention and subject
  erasure are implemented — POST /v1/retention/purge and
  /v1/retention/erase-endpoint, both dry-run by default — and full
  data export is available as JSON Lines via /v1/export/messages.
  Detail in docs/privacy.md.

# Do-no-harm posture — most relevant to the AI-teammate protocol.
doNoHarm: >-
  The rule-based parser is deliberately deterministic — an LLM does
  not decide what a message means on the hot path. The AI-teammate
  protocol constrains any AI participant to be silent by default,
  summoned only, always yielding to humans, read-only in v1, with
  every action audit-logged. Verification is fail-closed on every
  webhook, and account status gates traffic so a compromised sender can
  be suspended. A full harms analysis — seven named harms, what is built
  against each, what is left to the deploying agency, and an open list
  of known gaps — is published at docs/harms-analysis.md.

